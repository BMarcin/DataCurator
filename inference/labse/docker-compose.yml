services:
  labse:
    build: .
    image: labse-embed
    environment:
      LABSE_MODEL: sentence-transformers/LaBSE
      # LABSE_MAX_SEQ_LENGTH: "256"   # defaults to the model's own max length
      LABSE_DTYPE: float16            # float16 / bfloat16 to halve VRAM + latency on GPU
      MAX_BATCH_SIZE: "64"
      MAX_BATCH_WAIT_MS: "8"
      CUDA_VISIBLE_DEVICES: "0"
      LABSE_TOKEN: "${LABSE_TOKEN?set it in .env, blank leaves the service open}"
    ports:
      - "8024:8000"                   # POST /embed, GET /health, /metrics
    volumes:
      - hf-cache:/root/.cache/huggingface
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              device_ids: ["1"]       # dedicated GPU; pick the free device
#              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s              # first-start model download can be slow
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.labse.rule=Host(`${LABSE_PUBLIC_HOST:?set it in .env, see .env.example}`)"
      - "traefik.http.routers.labse.entrypoints=web"
      - "traefik.http.services.labse.loadbalancer.server.port=8000"
      # traefik only routes to backends on a network it is itself attached to.
      # traefik lives on the languagetool compose's network, so join that one
      # (referenced as the external `web` network below) instead of a private
      # per-project network traefik can't reach.
      - "traefik.docker.network=languagetool_web"
    networks:
      - web

volumes:
  hf-cache:

networks:
  web:
    external: true
    name: languagetool_web
