[project]
name = "datacurator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.24",
    "datasets>=5.0.0",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "jinja2>=3.1.6",
    "language-tool-python>=3.4.0",
    "loguru>=0.7.3",
    "nats-py>=2.15.0",
    "nvidia-ml-py>=13.610.43",
    "openai>=2.38.0",
    "orjson>=3.11.9",
    "prometheus-client>=0.25.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "starlette>=1.3.1",
    "tenacity>=9.1.4",
    "textual>=8.2.7",
    "uvicorn>=0.50.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
