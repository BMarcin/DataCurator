# @package _global_
#
# An experiment declares the *flow*: which stages run, in what order, over
# which dataset, and with which model. Each stage is toggled with `enabled`
# and picks its own model from the `_models` presets loaded below, so
# different stages can run on different LLMs. When stages use different
# models, set `runner.pause_between_stages: true` so the runner waits for
# you to swap the deployed model on the GPU between stages.
#
# Here a single LLM review stage runs against an OpenAI-compatible (vLLM)
# endpoint. Two modifiers run in the `before` phase to enrich each record
# before the prompt is built:
#   * Google Translate adds a reference translation (`google_translation`);
#   * LanguageTool normalises `target_text` and stashes leftover issues.
# The templated prompt then renders from those (possibly modified) fields.
#
# CLI examples:
#   # disable a stage on the fly
#   uv run python run_pipeline.py pipeline.review.enabled=false
#   # enable the second pass (runs on a different model)
#   uv run python run_pipeline.py pipeline.review_polish.enabled=true
#   # point a stage at a different preset
#   uv run python run_pipeline.py 'pipeline.review.stage.model=${_models.bielik}'
defaults:
  # Named model presets, referenced per stage as ${_models.<name>}. Add more
  # files under config/model/ and load them here to give stages more choices.
  - /model/qwen35@_models.qwen35
  - /model/bielik@_models.bielik
  - /stages/llm@pipeline.review
  - /stages/llm@pipeline.review_polish
  - _self_

experiment_name: example

# Job identity for the live dashboard (used only when reporting is enabled).
# The job_id is always `experiment_name`, so reruns share one dashboard entry;
# set the type and any deep-links to surface alongside this experiment here.
job:
  type: data-pipeline
  links: []   # e.g. [{label: TensorBoard, url: https://...}]

dataset:
  # `input` may be a single file, a glob, or a list of either (globs expanded,
  # paths de-duped and sorted) — e.g. `data/*.jsonl` or [data/a.jsonl, data/b.jsonl].
  input: data/example_input.jsonl
  output_dir: dataset/${experiment_name}   # each stage writes shards under <output_dir>/<NN>_<stage>/
  limit: 30   # process only the first N input rows (null = all); handy for smoke runs

order:
  - review
  - review_polish

pipeline:
  # First pass: review and improve each translation with Qwen.
  review:
    enabled: true
    stage:
      name: review
      model: ${_models.qwen35}
      response_model: DataCurator.pipeline.schemas.TranslationReview
      output_field: review
      prompt:
        - role: user
          template: improve-translations.j2
      # Modifiers run on each record around the stage's core work. Both below
      # are FieldModifiers: they read one field (`source`), transform it, and
      # write the result to `target`. Every FieldModifier shares four knobs:
      #   source   — field to read (required).
      #   target   — field to write; defaults to `source` (an in-place rewrite).
      #              Naming a new field instead *adds* it to the context.
      #   phase    — `before` (default) to enrich the prompt's inputs, or
      #              `after` to post-process the stage's output.
      #   required — false (default) skips the modifier when `source` is
      #              absent; true raises instead of silently doing nothing.
      modifiers:
        # RenameModifier is NOT a FieldModifier: instead of one source/target
        # pair it takes a `fields` mapping of `input -> output` and rewrites
        # several fields at once. A handy first `before`-pass for aligning a
        # raw dataset's column names with what the prompt and the modifiers
        # below expect — here the prompt reads `source_text` / `target_…` /
        # `*_language`, so map the incoming columns onto those names.
        #   keep     — false (default) drops each input after copying (a true
        #              rename); true leaves it in place (a copy).
        #   required — false (default) skips fields missing from the record;
        #              true raises if an input column is absent.
        - _target_: DataCurator.pipeline.modifiers.rename.RenameModifier
          fields:
            src_text: source_text
            tgt_text: target_text
            src_lang: source_language
            tgt_lang: target_language
          required: true
        # Add a Google-Translate reference under a NEW field (`target` differs
        # from `source`), leaving `source_text` untouched. The prompt reads
        # `google_translation`, so the modifier is what populates it.
        - _target_: DataCurator.pipeline.modifiers.google_translate.GoogleTranslateModifier
          source: source_text
          target: google_translation
          required: true
          source_language_code: en
          target_language_code: pl
        # Rewrite `target_text` IN PLACE (no `target:`, so it defaults to
        # the source) with LanguageTool's fixes, and stash any unresolved
        # findings under `issues_field` for the prompt to show the model.
        - _target_: DataCurator.pipeline.modifiers.languagetool.LanguageToolModifier
          source: target_text
          required: true
          issues_field: target_language_tool_fixes
          language: pl-PL
          remote_server: http://languagetool.loc

  # Optional second pass on a *different* model (Bielik), reading the first
  # pass's output. Disabled by default — flip `enabled` to true (and set
  # runner.pause_between_stages so you can swap the deployed model) to run it.
  review_polish:
    enabled: false
    stage:
      name: review_polish
      model: ${_models.bielik}
      response_model: DataCurator.pipeline.schemas.TranslationReview
      output_field: review_polish
      prompt:
        - role: user
          template: improve-translations.j2
