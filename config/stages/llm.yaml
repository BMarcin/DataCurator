# Reusable generic LLM stage. Compose it into an experiment under a
# package key, e.g. `- /stages/llm@pipeline.review`. Each stage instance
# picks its own model, so load the model presets in the experiment under
# `_models.*` and point `stage.model` at one (e.g. `${_models.qwen35}`).
# Override `stage.prompt` (templated conversation), `stage.response_model`
# (structured-output schema) and `stage.output_field` per instance.
enabled: true               # set false (here or in the experiment) to skip this stage

stage:
  _target_: DataCurator.pipeline.stages.llm.LLMStage
  model: ???                # required: point at a preset, e.g. ${_models.qwen35}
  response_model: DataCurator.pipeline.schemas.TranslationReview
  output_field: review
  # Required: a list of {role, template} (path to a .j2 file, by convention
  # ${prompt_dir}/<name>.j2) or {role, text} (the template inline) entries.
  # Prompt files are experiment assets kept outside git. Set `prompt: []` to
  # feed a pre-built conversation via `input_field` instead.
  input_field: messages
  prompt: ???
  modifiers: []
  # Guards over the parsed output, each a `_target_` ResponseValidator. They
  # run inside the stage's retry loop, so a failed guard resamples; a record
  # still failing after retries is flagged when its error type is listed in
  # runner.flag_on_errors (DataCurator.pipeline.validators.ResponseValidationError).
  validators: []

  # When a validator (guard) above rejects an output across all retries and the
  # record is flagged, keep the parsed output that failed the guard under
  # `rejected_output_field` so the generated content survives on the flagged
  # record (still marked error). Only applies to guard failures, not parse/other
  # errors. Off by default.
  keep_rejected_output: true
  rejected_output_field: rejected_output

  # Correction rounds when a guard rejects an output: the failed answer is
  # replayed as an assistant turn plus a user turn describing exactly what was
  # wrong (the validator's feedback), and the model is re-asked. 0 (default)
  # disables reprompting — every guard failure is blind-resampled as before.
  # Connection/parse failures are never reprompted; they keep the blind
  # model.retries budget, so the worst case is
  # model.retries × (reprompt_attempts + 1) requests per record.
  reprompt_attempts: 0

  # Optional keys, default in code and deliberately not set here (every key
  # rendered into a stage spec is part of its signature):
  #   repairs: []                    # OutputRepair `_target_`s applied to the parsed
  #                                  # output before the validators, e.g.
  #                                  # DataCurator.pipeline.repairs.LanguageToolRepair
  #   reprompt_on_truncation: false  # a max_tokens cut-off gets a correction round
  #                                  # (needs reprompt_attempts > 0)
  #   on_guard_failure: flag         # flag | keep — keep stores the rejected output
  #                                  # and the error in guard_failure_field
  #   guard_failure_field: null      # default <output_field>_guard_failure
